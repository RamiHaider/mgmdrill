<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MGM Drill Tracker</title>
<link rel="icon" type="image/png" href="assets/leaf.png">
<link rel="apple-touch-icon" href="assets/leaf.png">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="wrap row">
    <div class="brand"><img src="assets/leaf.png" alt=""><h1>Drill Tracker <small>Maple Gold Mines</small></h1></div>
    <nav id="nav" hidden>
      <a href="#map" data-view="map">Map</a>
      <a href="#holes" data-view="holes">Holes</a>
      <a href="#timesheet" data-view="timesheet">Timesheet</a>
      <a href="#production" data-view="production">Production</a>
      <a href="#report" data-view="report">Daily report</a>
      <a href="#sequence" data-view="sequence">Sequence</a>
      <a href="#stats" data-view="stats">Stats</a>
      <a href="#consumables" data-view="consumables">Consumables</a>
      <a href="#admin" data-view="admin" class="adminonly">Admin</a>
    </nav>
    <div class="who" id="who" hidden>
      <select id="projsel" class="projsel" title="Project"></select>
      <span id="whoName"></span><span class="role" id="whoRole"></span>
      <button class="btn sm" id="btnLogout">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-login" class="login" hidden>
    <div class="logo"><img src="assets/leaf.png" alt=""><h2>Drill Tracker</h2></div>
    <figure style="margin:0 0 6px"><img src="assets/hero.png" alt="" style="width:100%;border-radius:12px;border:2px solid var(--gold)"><figcaption class="note center" style="margin-top:6px">Exploration manager, on site. Vibe check: <b>Mortgage your house.</b></figcaption></figure>
    <form id="loginForm" class="card">
      <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="actions"><button class="btn primary" type="submit">Sign in</button><button class="btn ghost sm" type="button" id="lReset">Forgot password</button></div>
      <div id="loginMsg" class="msg" hidden></div>
      <p class="note center">Access is by invitation. Ask the project geologist or the database manager.</p>
    </form>
  </section>

  <section id="view-map" class="page" hidden></section>
  <section id="view-holes" class="page" hidden></section>
  <section id="view-timesheet" class="page" hidden></section>
  <section id="view-production" class="page" hidden></section>
  <section id="view-report" class="page" hidden></section>
  <section id="view-sequence" class="page" hidden></section>
  <section id="view-stats" class="page" hidden></section>
  <section id="view-consumables" class="page" hidden></section>
  <section id="view-admin" class="page" hidden></section>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-label="Details">
  <div class="hd"><h2 id="drawerTitle"></h2><button class="btn sm ghost" id="drawerClose" aria-label="Close">✕</button></div>
  <div class="bd" id="drawerBody"></div>
</aside>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/holes.js"></script>
<script src="js/timesheet.js"></script>
<script src="js/production.js"></script>
<script src="js/report.js"></script>
<script src="js/sequence.js"></script>
<script src="js/stats.js"></script>
<script src="js/consumables.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
